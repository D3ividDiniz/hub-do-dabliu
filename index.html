<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171c1c"><title>Hub do Dabliu</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet"><link rel="modulepreload" href="vendor/three.module.js"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#171c1c;color:#e7d6ad;font-family:Georgia,serif}body{overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse at 90% 25%,#52676770,transparent 50%),linear-gradient(100deg,#171914,#253333)}#scroll{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;scrollbar-width:none;touch-action:pan-y;z-index:2}#scroll::-webkit-scrollbar{display:none}.track{height:200000px}.shade{position:fixed;inset:0;background:#050b0a;opacity:0;transition:opacity .6s;pointer-events:none;z-index:1}body.reading .shade{opacity:0}#close{position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));width:44px;height:44px;background:#17201ac9;border:1px solid #c9b98e60;border-radius:50%;color:#e9dbbc;font:28px Georgia;cursor:pointer}#details{position:fixed;inset:0;z-index:4;pointer-events:none}#details[hidden],#close[hidden]{display:none}#projectLink{position:absolute;color:#342c1e;background:#e8dab770;border-bottom:1px solid #57462e;padding:10px 5px;font:16px Georgia;text-decoration:none;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:auto;opacity:0;transition:opacity .3s}body.open #projectLink{opacity:1}#projectLink:focus-visible,#close:focus-visible{outline:2px solid #e1b65e;outline-offset:5px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.keyboard-book:focus-visible{position:fixed;z-index:8;bottom:20px;left:20px;width:auto;height:auto;clip:auto;margin:0;padding:14px;background:#f1e2bd;color:#292a22;border:0;font:16px Georgia}#fallback{position:fixed;inset:0;padding:40px 24px;overflow:auto;z-index:8;background:#1b2420}#fallback[hidden]{display:none}#fallback a{display:block;color:#ead5ab;padding:18px 0}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:32px;z-index:5}body.ready #status{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#sound{position:fixed;z-index:7;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));width:42px;height:42px;border:1px solid #c9b98e40;border-radius:50%;background:#17201aa6;color:#d9c397;display:grid;place-items:center;cursor:pointer;opacity:.75;transition:opacity .2s}#sound:hover,#sound:focus-visible{opacity:1}#sound:focus-visible{outline:2px solid #e1b65e;outline-offset:4px}#sound[hidden]{display:none}#sound svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#sound .off{display:none}#sound.muted .off{display:block}#sound.muted .on{display:none}
</style></head><body><canvas id="scene" aria-hidden="true"></canvas><main id="scroll" aria-label="Estante de projetos. Role para explorar ou use Tab para escolher um livro."><div class="track"></div><nav id="keyboard" aria-label="Escolher projeto"></nav></main><div class="shade"></div><span id="status" role="status" aria-label="Carregando livros">❧</span><button id="close" aria-label="Fechar livro" hidden>×</button><section id="details" hidden role="dialog" aria-modal="true" aria-labelledby="bookName"><h1 id="bookName" class="sr"></h1><p id="bookDescription" class="sr"></p><a id="projectLink" target="_blank" rel="noopener noreferrer">Entrar no projeto</a></section><button id="sound" type="button" aria-label="Silenciar efeitos sonoros" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5Z"/><path class="on" d="M15 8c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/><path class="off" d="m16 9 6 6m0-6-6 6"/></svg></button><section id="fallback" hidden></section><script type="module" src="scene.js"></script></body></html>
