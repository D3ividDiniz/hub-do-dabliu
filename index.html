<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090c">

<title>DABLIU — Hub</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Share+Tech+Mono&display=swap');

:root{
  --bg:#07090c;
  --fg:#f4f7fa;
  --muted:#87909a;
  --line:#59646d;
  --accent:#b8f5ff;
  --accent2:#4dd9f0;
  --speed:420ms;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--fg);
}

body{
  font-family:"Share Tech Mono",monospace;
  overflow:hidden;
}

button{
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  border-radius:0;
  cursor:pointer;
}

.app{
  height:100dvh;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(77,217,240,.055),
      transparent 35%
    ),
    linear-gradient(
      115deg,
      #06080b,
      #0a0e13 52%,
      #05070a
    );
}

.app:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.22;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      rgba(255,255,255,.018) 3px 4px
    );
}

.app:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  box-shadow:
    inset 0 0 130px #000;

  z-index:20;
}


/* =========================================================
   BOOT
========================================================= */

.boot{
  position:absolute;
  inset:0;
  z-index:30;

  display:grid;
  place-items:center;

  text-align:center;

  background:#06080b;

  transition:.6s;
}

.boot.hide{
  opacity:0;
  visibility:hidden;
}

.boot-logo{
  font-family:Orbitron,sans-serif;
  font-size:clamp(42px,13vw,100px);
  letter-spacing:.18em;
}

.boot-sub{
  color:var(--muted);
  letter-spacing:.42em;
  font-size:10px;
  margin-top:15px;
}

.boot-line{
  width:min(280px,60vw);
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--accent),
      transparent
    );

  margin:28px auto;
}

.boot-start{
  font-size:13px;
  letter-spacing:.3em;
  padding:12px 25px;
  border:1px solid var(--line);
}


/* =========================================================
   HUB
========================================================= */

.hub{
  position:absolute;
  inset:0;

  opacity:0;
  transform:scale(1.02);

  transition:.6s;
}

.hub.show{
  opacity:1;
  transform:none;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0
    clamp(18px,5vw,60px);

  z-index:10;
}

.logo{
  font-family:Orbitron,sans-serif;
  font-size:16px;
  letter-spacing:.25em;
}

.header-right{
  display:flex;
  gap:20px;

  color:var(--muted);

  font-size:10px;
  letter-spacing:.18em;
}

.header-btn{
  padding:7px 0;
  border-bottom:1px solid transparent;
}

.header-btn:hover{
  color:#fff;
  border-color:var(--accent);
}


/* =========================================================
   CAROUSEL
========================================================= */

.carousel{
  position:absolute;

  inset:
    70px
    0
    118px
    0;

  display:flex;
  align-items:center;
  justify-content:center;

  touch-action:pan-y;
}

.stage{
  position:relative;

  width:100%;
  height:100%;

  max-width:1250px;

  display:flex;
  align-items:center;
  justify-content:center;

  perspective:1000px;
}

.project{
  position:absolute;

  left:50%;
  top:50%;

  width:min(58vw,620px);
  height:min(61vh,520px);

  min-height:350px;

  transform:
    translate(-50%,-50%);

  transition:
    transform var(--speed)
      cubic-bezier(.2,.8,.2,1),
    opacity var(--speed),
    filter var(--speed);

  opacity:0;
  pointer-events:none;
  filter:blur(2px);
}

.project.center{
  opacity:1;
  pointer-events:auto;
  filter:none;
  z-index:5;
}

.project.left{
  opacity:.35;

  transform:
    translate(
      calc(-50% - min(45vw,500px)),
      -50%
    )
    scale(.67)
    rotateY(18deg);

  filter:blur(.6px);
  z-index:2;
}

.project.right{
  opacity:.35;

  transform:
    translate(
      calc(-50% + min(45vw,500px)),
      -50%
    )
    scale(.67)
    rotateY(-18deg);

  filter:blur(.6px);
  z-index:2;
}

.project.far{
  opacity:0;
  z-index:1;
}


/* =========================================================
   PROJECT ART
========================================================= */

.project-art{
  position:absolute;
  inset:0;

  overflow:hidden;

  border:1px solid #414b54;

  background:
    linear-gradient(
      135deg,
      #0d151b,
      #080b0e 55%,
      #11171c
    );

  box-shadow:
    0 24px 60px rgba(0,0,0,.45),
    0 0 0 1px
      rgba(255,255,255,.025)
      inset;
}

.project-art:before{
  content:"";

  position:absolute;
  inset:-30%;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 42px,
      rgba(184,245,255,.035) 43px,
      transparent 44px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 42px,
      rgba(184,245,255,.025) 43px,
      transparent 44px
    );

  transform:rotate(-14deg);
}

.project-art:after{
  content:"";

  position:absolute;

  width:150%;
  height:1px;

  background:var(--accent);

  opacity:.25;

  top:35%;
  left:-25%;

  transform:rotate(-12deg);

  box-shadow:
    0 0 25px var(--accent2);
}

.project-art[data-theme="dark"]{
  background:
    radial-gradient(
      circle,
      rgba(130,80,255,.1),
      transparent 30%
    ),
    linear-gradient(
      140deg,
      #09070d,
      #050506
    );
}

.project-art[data-theme="dog"]{
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.12),
      transparent 28%
    ),
    linear-gradient(
      140deg,
      #111,
      #080808
    );
}

.project-art[data-theme="bingo"]{
  background:
    radial-gradient(
      circle,
      rgba(77,217,240,.1),
      transparent 30%
    ),
    linear-gradient(
      140deg,
      #071117,
      #06080a
    );
}

.project-art[data-theme="paint"]{
  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(255,255,255,.1),
      transparent 20%
    ),
    linear-gradient(
      140deg,
      #101010,
      #070707
    );
}


/* =========================================================
   PROJECT COPY
========================================================= */

.project-copy{
  position:absolute;
  inset:0;

  padding:
    clamp(22px,4vw,45px);

  display:flex;
  flex-direction:column;
  justify-content:flex-end;

  background:
    linear-gradient(
      180deg,
      transparent 35%,
      rgba(0,0,0,.15) 48%,
      rgba(0,0,0,.94) 100%
    );
}

.project-index{
  font-size:10px;
  letter-spacing:.2em;
  color:var(--accent);

  margin-bottom:auto;
}

.project-name{
  font-family:Orbitron,sans-serif;

  font-size:
    clamp(27px,4.5vw,52px);

  line-height:1.05;
  letter-spacing:.06em;

  text-transform:uppercase;

  max-width:90%;
}

.project-type{
  font-size:10px;
  color:var(--muted);
  letter-spacing:.22em;
  margin-top:12px;
}

.project-desc{
  font-size:11px;
  color:#b5bdc4;

  max-width:520px;

  line-height:1.6;

  margin:14px 0 18px;
}

.enter{
  align-self:flex-start;

  border:1px solid #76818b;

  padding:10px 16px;

  font-size:11px;
  letter-spacing:.18em;

  background:
    rgba(5,7,9,.55);
}

.enter:hover{
  border-color:var(--accent);
  color:var(--accent);

  box-shadow:
    0 0 22px
    rgba(77,217,240,.12);
}


/* =========================================================
   ARROWS
========================================================= */

.nav-arrow{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  z-index:9;

  width:58px;
  height:100px;

  color:#a9b2b9;

  font-size:27px;
}

.nav-arrow:hover{
  color:#fff;
}

.nav-arrow.prev{
  left:clamp(5px,3vw,50px);
}

.nav-arrow.next{
  right:clamp(5px,3vw,50px);
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:118px;

  border-top:
    1px solid
    rgba(93,104,114,.45);

  z-index:10;

  display:flex;
  flex-direction:column;
  justify-content:center;

  gap:12px;

  padding:
    0
    clamp(18px,5vw,60px);

  background:
    rgba(7,9,12,.7);
}

.footer-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  font-size:10px;
  color:var(--muted);

  letter-spacing:.16em;
}

.dots{
  display:flex;
  justify-content:center;
  gap:7px;
}

.dot{
  width:5px;
  height:5px;

  border:1px solid #5c6670;

  transform:rotate(45deg);
}

.dot.active{
  background:var(--accent);
  border-color:var(--accent);

  box-shadow:
    0 0 10px var(--accent2);
}


/* =========================================================
   LIBRARY
========================================================= */

.library{
  position:absolute;

  inset:0;

  z-index:40;

  background:
    rgba(5,7,9,.985);

  opacity:0;
  visibility:hidden;

  transform:translateY(18px);

  transition:.35s;

  padding:
    clamp(18px,4vw,58px);

  overflow:auto;
}

.library.show{
  opacity:1;
  visibility:visible;
  transform:none;
}

.library-head{
  display:flex;
  align-items:end;
  justify-content:space-between;

  border-bottom:
    1px solid var(--line);

  padding-bottom:14px;
}

.library-title{
  font-family:Orbitron;

  font-size:
    clamp(24px,4vw,40px);

  letter-spacing:.12em;
}

.library-meta{
  font-size:9px;
  color:#69747d;

  letter-spacing:.18em;

  margin-top:7px;
}

.close{
  font-size:11px;

  letter-spacing:.18em;

  color:var(--muted);

  padding:8px 0;
}

.close:hover{
  color:#fff;
}

.library-list{
  margin:22px 0 0;

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(270px,1fr)
    );

  gap:10px;
}

.lib-item{
  position:relative;

  display:grid;

  grid-template-columns:
    72px
    1fr;

  min-height:92px;

  align-items:stretch;

  gap:14px;

  text-align:left;

  border:1px solid #252d34;

  background:#090d11;

  overflow:hidden;

  transition:
    transform .22s,
    border-color .22s,
    background .22s;
}

.lib-item:hover,
.lib-item.active{
  border-color:#61717d;

  background:#0d141a;

  transform:translateY(-2px);
}

.lib-visual{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #101a21,
      #070a0d
    );

  border-right:
    1px solid #273139;
}

.lib-visual:before{
  content:"";

  position:absolute;

  inset:-30%;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 16px,
      rgba(184,245,255,.06) 17px,
      transparent 18px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 16px,
      rgba(184,245,255,.035) 17px,
      transparent 18px
    );

  transform:rotate(-18deg);
}

.lib-symbol{
  position:absolute;

  inset:0;

  display:grid;

  place-items:center;

  font-family:Orbitron;

  font-size:23px;

  color:var(--accent);

  text-shadow:
    0 0 18px
    rgba(77,217,240,.35);
}

.lib-info{
  padding:
    13px
    13px
    11px
    0;

  min-width:0;
}

.lib-top{
  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:center;
}

.lib-num{
  font-size:9px;

  color:#66737d;

  letter-spacing:.14em;
}

.lib-name{
  font-family:Orbitron;

  font-size:12px;

  line-height:1.25;

  letter-spacing:.07em;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.lib-type{
  font-size:8px;

  color:#73808a;

  letter-spacing:.14em;

  margin-top:7px;
}

.lib-usage{
  font-size:8px;

  color:#4e5a63;

  letter-spacing:.1em;

  margin-top:10px;
}

.lib-item.active .lib-name,
.lib-item.active .lib-symbol{
  color:var(--accent);
}

.lib-badge{
  position:absolute;

  right:8px;
  bottom:7px;

  font-size:7px;

  letter-spacing:.12em;

  color:#52616b;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  left:50%;
  bottom:128px;

  transform:
    translate(-50%,20px);

  opacity:0;

  z-index:100;

  pointer-events:none;

  border:1px solid #53606a;

  background:#090d11;

  padding:8px 13px;

  font-size:10px;

  letter-spacing:.14em;

  transition:.25s;
}

.toast.show{
  opacity:1;

  transform:
    translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .header{
    height:58px;
    padding:0 18px;
  }

  .header-right span{
    display:none;
  }

  .carousel{
    inset:
      58px
      0
      110px
      0;
  }

  .project{
    width:min(78vw,500px);

    height:min(61vh,500px);

    min-height:390px;
  }

  .project.left{
    transform:
      translate(
        calc(-50% - 73vw),
        -50%
      )
      scale(.7)
      rotateY(15deg);
  }

  .project.right{
    transform:
      translate(
        calc(-50% + 73vw),
        -50%
      )
      scale(.7)
      rotateY(-15deg);
  }

  .nav-arrow{
    width:42px;
  }

  .project-name{
    font-size:
      clamp(24px,7vw,38px);
  }

  .project-desc{
    font-size:10px;
  }

  .footer{
    height:110px;
    padding:0 18px;
  }

  .library{
    padding:18px;
  }

  .library-list{
    grid-template-columns:1fr;
    gap:8px;
  }

  .lib-item{
    min-height:84px;
  }

  .lib-visual{
    width:62px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     BOOT
====================================================== -->

<section class="boot" id="boot">

  <div>

    <div class="boot-logo">
      DABLIU
    </div>

    <div class="boot-sub">
      DIGITAL PROJECT LIBRARY
    </div>

    <div class="boot-line"></div>

    <button
      class="boot-start"
      id="bootStart">

      PRESS START

    </button>

  </div>

</section>


<!-- =====================================================
     HUB
====================================================== -->

<main class="hub" id="hub">

<header class="header">

  <div class="logo">
    DABLIU
  </div>

  <div class="header-right">

    <span id="clock">
      00:00
    </span>

    <button
      class="header-btn"
      id="libraryBtn">

      BIBLIOTECA

    </button>

  </div>

</header>


<section
  class="carousel"
  id="carousel">

  <button
    class="nav-arrow prev"
    id="prev">

    ‹

  </button>

  <div
    class="stage"
    id="stage">
  </div>

  <button
    class="nav-arrow next"
    id="next">

    ›

  </button>

</section>


<footer class="footer">

  <div class="footer-top">

    <span id="counter">
      01 / 12
    </span>

    <span>
      ← → &nbsp; DESLIZE / NAVEGUE
    </span>

    <span>
      ● ONLINE
    </span>

  </div>

  <div
    class="dots"
    id="dots">
  </div>

</footer>

</main>


<!-- =====================================================
     LIBRARY
====================================================== -->

<section
  class="library"
  id="library">

  <div class="library-head">

    <div>

      <div
        style="
          font-size:10px;
          color:#7c8790;
          letter-spacing:.22em;
          margin-bottom:8px
        ">

        DABLIU / SYSTEM

      </div>

      <div class="library-title">
        BIBLIOTECA
      </div>

      <div
        class="library-meta"
        id="libraryMeta">

        ATIVIDADE RECENTE

      </div>

    </div>


    <button
      class="close"
      id="closeLibrary">

      ESC / FECHAR

    </button>

  </div>


  <div
    class="library-list"
    id="libraryList">
  </div>

</section>


<div
  class="toast"
  id="toast">
</div>

</div>


<script>

/* =========================================================
   PROJETOS
========================================================= */

const projects = [

  {
    name:"TORRE DE DANOI",
    type:"GAME · PUZZLE",
    desc:"O clássico jogo de lógica. 100 níveis, recordes e progresso local.",
    url:"https://hanoi-23d2.onrender.com",
    theme:"hanoi"
  },

  {
    name:"BINGO",
    type:"GAME",
    desc:"Bingo digital para jogar direto no navegador.",
    url:"https://jogo-bingo.onrender.com",
    theme:"bingo"
  },

  {
    name:"PONTINHOS",
    type:"GAME",
    desc:"Um jogo simples de estratégia e precisão.",
    url:"https://jogo-dos-pontinhos.onrender.com",
    theme:"grid"
  },

  {
    name:"TERNO",
    type:"GAME",
    desc:"Experiência de jogo publicada no GitHub Pages.",
    url:"https://d3ividdiniz.github.io/terno_jogo_js/",
    theme:"terno"
  },

  {
    name:"DARK HISTORIE",
    type:"GAME · STORY",
    desc:"Uma experiência narrativa com estética sombria.",
    url:"https://dark-historie-game.onrender.com",
    theme:"dark"
  },

  {
    name:"ROLETA RUSSA DO CAFÉ",
    type:"GAME",
    desc:"Uma roleta para decidir o destino do próximo café.",
    url:"https://roleta-russa-do-cafe.onrender.com",
    theme:"coffee"
  },

  {
    name:"RANKING DOG",
    type:"GAME · SOCIAL",
    desc:"Monte e compare seu ranking de cachorros.",
    url:"https://ranking-dog.onrender.com",
    theme:"dog"
  },

  {
    name:"PERIODIC TABLE",
    type:"LAB · TOOL",
    desc:"Uma tabela periódica interativa.",
    url:"https://p-e-r-i-and-t-a-b-l-e.onrender.com",
    theme:"periodic"
  },

  {
    name:"PAINT JS",
    type:"LAB",
    desc:"Experimento de desenho feito para a web.",
    url:"https://d3ividdiniz.github.io/paint_js/",
    theme:"paint"
  },

  {
    name:"HUB TOOLS",
    type:"TOOL",
    desc:"Coleção de ferramentas úteis em um só lugar.",
    url:"https://hub-tools-ebon.vercel.app",
    theme:"tools"
  },

  {
    name:"FOCO",
    type:"APP · ESTUDOS",
    desc:"Controle de tempo e estudos.",
    url:"https://foco-4yd0.onrender.com",
    theme:"focus"
  },

  {
    name:"FITAPP",
    type:"APP · FITNESS",
    desc:"Seu espaço digital para academia e treino.",
    url:"https://fit-app-g1f1.onrender.com",
    theme:"fit"
  }

];


/* =========================================================
   ELEMENTOS
========================================================= */

const stage =
  document.getElementById("stage");

const dots =
  document.getElementById("dots");

const list =
  document.getElementById("libraryList");


/* =========================================================
   ESTADO
========================================================= */

let current =
  Number(
    localStorage.getItem(
      "dabliu_current"
    ) || 0
  );

current =
  (
    current %
    projects.length +
    projects.length
  )
  %
  projects.length;


/* =========================================================
   LOCAL STORAGE
========================================================= */

const ACCESS_KEY =
  "dabliu_access_history";

const MODE_KEY =
  "dabliu_view_mode";

const ORDER_KEY =
  "dabliu_library_order";


function getAccessHistory(){

  try{

    const value =
      JSON.parse(
        localStorage.getItem(
          ACCESS_KEY
        ) || "{}"
      );

    return value &&
      typeof value === "object"
      ? value
      : {};

  }catch{

    return {};

  }

}


function saveAccessHistory(
  history
){

  localStorage.setItem(
    ACCESS_KEY,
    JSON.stringify(history)
  );

}


/* =========================================================
   REGISTRAR ACESSO
========================================================= */

function registerAccess(index){

  const history =
    getAccessHistory();

  const key =
    String(index);


  if(
    !Array.isArray(
      history[key]
    )
  ){

    history[key] = [];

  }


  history[key].push(
    Date.now()
  );


  /*
    Mantém somente aproximadamente
    um ano de histórico.
  */

  const cutoff =
    Date.now() -
    366 *
    24 *
    60 *
    60 *
    1000;


  history[key] =
    history[key].filter(
      timestamp =>
        timestamp >= cutoff
    );


  saveAccessHistory(
    history
  );

}


/* =========================================================
   ÚLTIMO ACESSO
========================================================= */

function lastAccess(index){

  const history =
    getAccessHistory();

  const accesses =
    history[
      String(index)
    ];


  if(
    !Array.isArray(accesses) ||
    !accesses.length
  ){

    return 0;

  }


  return Math.max(
    ...accesses
  );

}


/* =========================================================
   ACESSOS EM PERÍODO
========================================================= */

function accessCountSince(
  index,
  days
){

  const history =
    getAccessHistory();

  const accesses =
    history[
      String(index)
    ];


  if(
    !Array.isArray(accesses)
  ){

    return 0;

  }


  const cutoff =
    Date.now() -
    days *
    24 *
    60 *
    60 *
    1000;


  return accesses.filter(
    timestamp =>
      timestamp >= cutoff
  ).length;

}


/* =========================================================
   SCORE
========================================================= */

function accessScore(index){

  return {

    twoWeeks:
      accessCountSince(
        index,
        14
      ),

    month:
      accessCountSince(
        index,
        30
      ),

    year:
      accessCountSince(
        index,
        365
      ),

    last:
      lastAccess(index)

  };

}


/* =========================================================
   ORDENAÇÃO
========================================================= */

function sortLibraryIndices(){

  const indices =
    projects.map(
      (_,index) =>
        index
    );


  indices.sort(
    (a,b) => {

      const A =
        accessScore(a);

      const B =
        accessScore(b);


      /*
        PRIORIDADE 1:
        últimos 14 dias
      */

      if(
        A.twoWeeks !==
        B.twoWeeks
      ){

        return (
          B.twoWeeks -
          A.twoWeeks
        );

      }


      /*
        PRIORIDADE 2:
        último mês
      */

      if(
        A.month !==
        B.month
      ){

        return (
          B.month -
          A.month
        );

      }


      /*
        PRIORIDADE 3:
        último ano
      */

      if(
        A.year !==
        B.year
      ){

        return (
          B.year -
          A.year
        );

      }


      /*
        DESEMPATE:
        acesso mais recente
      */

      if(
        A.last !==
        B.last
      ){

        return (
          B.last -
          A.last
        );

      }


      /*
        Sem histórico:
        ordem aleatória.
      */

      return (
        Math.random() -
        .5
      );

    }
  );


  localStorage.setItem(
    ORDER_KEY,
    JSON.stringify({
      generatedAt:
        Date.now(),

      order:
        indices
    })
  );


  return indices;

}


/* =========================================================
   FORMATAÇÃO DO ÚLTIMO ACESSO
========================================================= */

function formatLastAccess(
  index
){

  const last =
    lastAccess(index);


  if(!last){

    return "NUNCA ACESSADO";

  }


  const difference =
    Date.now() -
    last;


  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;


  if(
    difference <
    minute
  ){

    return "ACESSADO AGORA";

  }


  if(
    difference <
    hour
  ){

    return `
      HÁ
      ${Math.floor(
        difference /
        minute
      )}
      MIN
    `;

  }


  if(
    difference <
    day
  ){

    return `
      HÁ
      ${Math.floor(
        difference /
        hour
      )}
      H
    `;

  }


  if(
    difference <
    7 * day
  ){

    return `
      HÁ
      ${Math.floor(
        difference /
        day
      )}
      DIAS
    `;

  }


  return new Date(
    last
  ).toLocaleDateString(
    "pt-BR"
  );

}


/* =========================================================
   LABEL DE ATIVIDADE
========================================================= */

function activityLabel(
  index
){

  const score =
    accessScore(index);


  if(
    score.twoWeeks > 0
  ){

    return `
      2 SEMANAS ·
      ${score.twoWeeks}
      ACESSO${score.twoWeeks === 1 ? "" : "S"}
    `;

  }


  if(
    score.month > 0
  ){

    return `
      MÊS ·
      ${score.month}
      ACESSO${score.month === 1 ? "" : "S"}
    `;

  }


  if(
    score.year > 0
  ){

    return `
      ANO ·
      ${score.year}
      ACESSO${score.year === 1 ? "" : "S"}
    `;

  }


  return "SEM HISTÓRICO";

}


/* =========================================================
   MODO PADRÃO
========================================================= */

function rememberViewMode(
  mode
){

  localStorage.setItem(
    MODE_KEY,
    mode
  );

}


function getViewMode(){

  return (
    localStorage.getItem(
      MODE_KEY
    ) || "carousel"
  );

}


/* =========================================================
   BUILD
========================================================= */

function build(){

  stage.innerHTML = "";

  dots.innerHTML = "";

  list.innerHTML = "";


  /*
    CARROSSEL
  */

  projects.forEach(
    (project,index) => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "project";


      card.innerHTML = `

        <div
          class="project-art"
          data-theme="${project.theme}">

          <div
            class="project-copy">

            <div
              class="project-index">

              ${String(index+1).padStart(2,"0")}
              /
              ${String(projects.length).padStart(2,"0")}

            </div>


            <div
              class="project-name">

              ${project.name}

            </div>


            <div
              class="project-type">

              ${project.type}

            </div>


            <div
              class="project-desc">

              ${project.desc}

            </div>


            <button
              class="enter">

              X &nbsp; ENTRAR

            </button>

          </div>

        </div>

      `;


      card
        .querySelector(".enter")
        .onclick =
          () =>
            openProject(index);


      stage.appendChild(
        card
      );


      /*
        DOT
      */

      const dot =
        document.createElement(
          "button"
        );


      dot.className =
        "dot";


      dot.onclick =
        () =>
          go(index);


      dots.appendChild(
        dot
      );

    }
  );


  /*
    BIBLIOTECA
  */

  const order =
    sortLibraryIndices();


  order.forEach(
    (
      projectIndex,
      position
    ) => {

      const project =
        projects[
          projectIndex
        ];


      const item =
        document.createElement(
          "button"
        );


      item.className =
        "lib-item";


      let symbol;


      if(
        project.type.includes(
          "GAME"
        )
      ){

        symbol = "X";

      }

      else if(
        project.type.includes(
          "APP"
        )
      ){

        symbol = "◆";

      }

      else if(
        project.type.includes(
          "TOOL"
        )
      ){

        symbol = "⌘";

      }

      else{

        symbol = "◇";

      }


      item.innerHTML = `

        <div
          class="lib-visual"
          data-theme="${project.theme}">

          <div
            class="lib-symbol">

            ${symbol}

          </div>

        </div>


        <div
          class="lib-info">

          <div
            class="lib-top">

            <span
              class="lib-name">

              ${project.name}

            </span>


            <span
              class="lib-num">

              ${String(
                position + 1
              ).padStart(2,"0")}

            </span>

          </div>


          <div
            class="lib-type">

            ${project.type}

          </div>


          <div
            class="lib-usage">

            ${activityLabel(
              projectIndex
            )}

            &nbsp; / &nbsp;

            ${formatLastAccess(
              projectIndex
            )}

          </div>

        </div>


        <span
          class="lib-badge">

          ${
            projectIndex === current
              ? "SELECIONADO"
              : ""
          }

        </span>

      `;


      item.onclick = () => {

        go(
          projectIndex
        );

        closeLibrary();

      };


      list.appendChild(
        item
      );

    }
  );


  document
    .getElementById(
      "libraryMeta"
    )
    .textContent =
      `ATIVIDADE RECENTE · ${projects.length} PROJETOS`;


  render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const total =
    projects.length;


  [
    ...stage.children
  ]
  .forEach(
    (element,index) => {

      let distance =
        index -
        current;


      if(
        distance >
        total / 2
      ){

        distance -=
          total;

      }


      if(
        distance <
        -total / 2
      ){

        distance +=
          total;

      }


      element.className =
        "project";


      if(
        distance === 0
      ){

        element.classList.add(
          "center"
        );

      }

      else if(
        distance === -1
      ){

        element.classList.add(
          "left"
        );

      }

      else if(
        distance === 1
      ){

        element.classList.add(
          "right"
        );

      }

      else{

        element.classList.add(
          "far"
        );

      }

    }
  );


  [
    ...dots.children
  ]
  .forEach(
    (dot,index) => {

      dot.classList.toggle(
        "active",
        index === current
      );

    }
  );


  document
    .getElementById(
      "counter"
    )
    .textContent =
      `${String(
        current + 1
      ).padStart(2,"0")} / ${String(
        total
      ).padStart(2,"0")}`;


  localStorage.setItem(
    "dabliu_current",
    current
  );

}


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function go(index){

  current =
    (
      index +
      projects.length
    )
    %
    projects.length;


  render();

}


function next(){

  go(
    current + 1
  );

}


function previous(){

  go(
    current - 1
  );

}


/* =========================================================
   ABRIR PROJETO
========================================================= */

function openProject(index){

  /*
    Registra o acesso
    antes de sair do Hub.
  */

  registerAccess(
    index
  );


  sortLibraryIndices();


  showToast(
    "ABRINDO / " +
    projects[index].name
  );


  setTimeout(
    () => {

      location.href =
        projects[index].url;

    },
    180
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
  text
){

  const element =
    document.getElementById(
      "toast"
    );


  element.textContent =
    text;


  element.classList.add(
    "show"
  );


  clearTimeout(
    showToast.timer
  );


  showToast.timer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      900
    );

}


/* =========================================================
   BOTÕES
========================================================= */

document
  .getElementById("prev")
  .onclick =
    previous;


document
  .getElementById("next")
  .onclick =
    next;


/* =========================================================
   SWIPE
========================================================= */

let startX = 0;
let startY = 0;


const carousel =
  document.getElementById(
    "carousel"
  );


carousel.addEventListener(
  "touchstart",
  event => {

    startX =
      event.touches[0].clientX;

    startY =
      event.touches[0].clientY;

  },
  {
    passive:true
  }
);


carousel.addEventListener(
  "touchend",
  event => {

    const endX =
      event.changedTouches[0].clientX;

    const endY =
      event.changedTouches[0].clientY;


    const dx =
      endX -
      startX;


    const dy =
      endY -
      startY;


    if(
      Math.abs(dx) > 55 &&
      Math.abs(dx) >
      Math.abs(dy) * 1.2
    ){

      if(dx < 0){

        next();

      }

      else{

        previous();

      }

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      document
        .getElementById(
          "library"
        )
        .classList
        .contains("show")
    ){

      if(
        event.key === "Escape"
      ){

        closeLibrary();

      }

      return;

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      next();

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      previous();

    }


    if(
      event.key ===
      "Enter"
    ){

      openProject(
        current
      );

    }


    if(
      event.key.toLowerCase()
      === "l"
    ){

      openLibrary();

    }

  }
);


/* =========================================================
   MOUSE WHEEL
========================================================= */

let wheelLock =
  false;


carousel.addEventListener(
  "wheel",
  event => {

    if(wheelLock)
      return;


    if(
      Math.abs(event.deltaX) > 10 ||
      Math.abs(event.deltaY) > 30
    ){

      wheelLock =
        true;


      if(
        event.deltaX > 0 ||
        event.deltaY > 0
      ){

        next();

      }

      else{

        previous();

      }


      setTimeout(
        () => {

          wheelLock =
            false;

        },
        450
      );

    }

  },
  {
    passive:true
  }
);


/* =========================================================
   BIBLIOTECA
========================================================= */

const library =
  document.getElementById(
    "library"
  );


function openLibrary(){

  /*
    A biblioteca vira
    o modo padrão.
  */

  rememberViewMode(
    "library"
  );


  /*
    Atualiza a ordem antes
    de mostrar a biblioteca.
  */

  build();


  library.classList.add(
    "show"
  );

}


function closeLibrary(){

  /*
    Se fechou a biblioteca,
    o modo padrão volta a ser
    o carrossel.
  */

  rememberViewMode(
    "carousel"
  );


  library.classList.remove(
    "show"
  );

}


document
  .getElementById(
    "libraryBtn"
  )
  .onclick =
    openLibrary;


document
  .getElementById(
    "closeLibrary"
  )
  .onclick =
    closeLibrary;


/* =========================================================
   MODO PADRÃO
========================================================= */

document
  .getElementById(
    "bootStart"
  )
  .onclick =
    () => {

      document
        .getElementById(
          "boot"
        )
        .classList
        .add("hide");


      document
        .getElementById(
          "hub"
        )
        .classList
        .add("show");


      /*
        Se o usuário estava na
        biblioteca quando saiu,
        ela abre automaticamente.
      */

      if(
        getViewMode() ===
        "library"
      ){

        setTimeout(
          openLibrary,
          260
        );

      }

    };


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const now =
    new Date();


  const hours =
    String(
      now.getHours()
    ).padStart(2,"0");


  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  document
    .getElementById(
      "clock"
    )
    .textContent =
      `${hours}:${minutes}`;

}


updateClock();


setInterval(
  updateClock,
  10000
);


/* =========================================================
   INIT
========================================================= */

build();

</script>

</body>
</html>
