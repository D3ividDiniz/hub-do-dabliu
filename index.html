<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131713"><title>Hub do Dabliu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#131713;color:#eedfc1;font-family:Georgia,serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #f5d68e;outline-offset:5px}
#shelf{height:100dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:none;scrollbar-width:none;background:radial-gradient(ellipse at 50% 45%,#41423044,transparent 75%)}#shelf::-webkit-scrollbar{display:none}.rack{width:min(720px,90vw);margin:auto;position:relative;background:linear-gradient(90deg,#0007,transparent 7%,transparent 93%,#0007);box-shadow:0 0 80px #0007}.group{padding:0 22px}.slot{display:block;position:relative;width:100%;height:var(--h);padding:0;margin:0;border:0;background:transparent;color:var(--ink);perspective:900px;text-align:left}.spine{position:absolute;left:var(--offset);width:var(--width);inset-block:2px;display:flex;align-items:center;background-color:var(--cover);border-radius:5px 3px 3px 6px;box-shadow:inset 0 2px 2px #fff3,inset 0 -5px 5px #0007,0 5px 6px #000c;pointer-events:none;transform:translateX(0) rotateY(-2deg);transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;transform-style:preserve-3d}.spine:before{content:'';position:absolute;inset:8px;border:var(--frame);border-radius:2px;opacity:.6}.spine:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0006,transparent 5%,#ffffff12 7%,transparent 13%,transparent 89%,#0006 96%,#ffffff16 98%);border-radius:inherit}.leather{background-image:radial-gradient(ellipse at 30% 30%,#fff1,transparent 70%),repeating-radial-gradient(ellipse at 20% 40%,#0002 0 1px,transparent 1px 4px);background-size:auto,7px 5px}.cloth{background-image:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,#0003 0 1px,transparent 1px 3px)}.paper{background-image:repeating-linear-gradient(4deg,#0001 0 1px,transparent 1px 5px),linear-gradient(110deg,#fff2,transparent)}.seal{flex-shrink:0;width:76px;text-align:center;font-size:29px;z-index:1}.spine-title{font-family:var(--font);font-size:clamp(16px,2.7vw,27px);letter-spacing:var(--spacing);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;padding-right:12px}.bands{position:absolute;left:62px;width:5px;top:0;bottom:0;border-inline:var(--bands);opacity:.5}.tail{margin-left:auto;padding:0 24px 0 10px;z-index:1;font-size:20px}.slot[data-picked] .spine{opacity:0}.slot:focus-visible .spine{transform:translateX(18px) translateZ(25px)}@media(hover:hover){.slot:hover .spine{transform:translateX(22px) translateZ(25px);filter:brightness(1.13)}}
#viewer{position:fixed;inset:0;z-index:20;display:grid;place-items:center;perspective:1800px;background:#080b08dd;opacity:0;transition:opacity .3s}#viewer[hidden]{display:none}#viewer.visible{opacity:1}.dismiss{position:absolute;right:max(22px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top));width:44px;height:44px;border:1px solid #bbae8c55;border-radius:50%;background:#161c17;color:#eadfc3;font:28px Georgia;z-index:5}.volume{--bw:min(32vw,270px);--bh:calc(var(--bw)*1.45);position:relative;width:var(--bw);height:var(--bh);transform-style:preserve-3d;transform:rotateX(-55deg) rotateY(-20deg) rotateZ(-85deg) scale(.8);transition:transform .85s cubic-bezier(.2,.7,.2,1);color:var(--ink)}#viewer.facing .volume{transform:rotateX(0) rotateY(-14deg) rotateZ(0) scale(1)}#viewer.opened .volume{transform:translateX(46%) rotateY(-5deg)}.back,.page,.lid,.cover-face,.lining{position:absolute;inset:0;border-radius:2px 7px 7px 2px}.back{background:var(--cover);transform:translateZ(-20px);box-shadow:10px 22px 55px #000a}.page{inset:5px 5px 5px 2px;background:linear-gradient(90deg,#aa9469,#ddcfaa 6%,#f0e4c7 20%,#e6d7b7 94%,#b9a580);color:#363323;transform:translateZ(-2px);padding:10%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;box-shadow:2px 2px 1px #bba880,4px 4px 1px #d1c09e,6px 6px 1px #a79571}.page .glyph{font-size:32px;color:#7b643e}.page h2{font-size:clamp(17px,2.5vw,25px);line-height:1.1;font-weight:400}.page p{font-size:clamp(12px,1.6vw,15px);line-height:1.6;margin:0 0 20px}.page a{font:12px 'Space Mono',monospace;color:#23392c;padding:10px 3px;text-underline-offset:5px;pointer-events:none;visibility:hidden}#viewer.opened .page a{pointer-events:auto;visibility:visible}.lid{transform-style:preserve-3d;transform-origin:left center;transform:rotateY(0);transition:transform 1.1s cubic-bezier(.35,.05,.2,1);z-index:2}#viewer.opened .lid{transform:rotateY(-162deg)}.cover-face{backface-visibility:hidden;background-color:var(--cover);display:flex;align-items:center;flex-direction:column;justify-content:space-between;text-align:center;padding:12% 11%;box-shadow:inset 7px 0 6px #0004,inset 0 0 4px #ffffff36;border:2px solid #0003}.cover-face:before{content:'';position:absolute;inset:7%;border:var(--frame);pointer-events:none;opacity:.65}.cover-face strong{font:clamp(23px,3.8vw,40px)/1.05 var(--font);font-weight:400;overflow-wrap:anywhere}.cover-face .emblem{font-size:clamp(45px,8vw,80px);border:1px solid currentColor;border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center}.cover-face small{font:9px 'Space Mono';letter-spacing:.2em}.lining{transform:rotateY(180deg);backface-visibility:hidden;background:repeating-linear-gradient(45deg,#6b694c15 0 1px,transparent 1px 7px),#d8cbab;box-shadow:inset -8px 0 13px #554b2a4d;display:grid;place-items:center;color:#92805b;font-size:48px;border:5px solid var(--cover)}.book-edge{position:absolute;left:-20px;top:0;width:20px;height:100%;background-color:var(--cover);transform-origin:right;transform:rotateY(-90deg);box-shadow:inset 0 0 5px #0008}.ghost{position:fixed;z-index:25;pointer-events:none;margin:0}.ghost .spine{inset:0;width:100%}.vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 40px 45px -30px #000c,inset 0 -40px 45px -30px #000c;z-index:2}
@media(max-width:600px){.rack{width:96vw}.group{padding:0 12px}.seal{width:58px;font-size:24px}.bands{left:47px}.tail{padding-right:14px}.volume{--bw:39vw}.page{padding:9%}.page p{font-size:12px;margin-bottom:8px}.page h2{font-size:17px}.page .glyph{font-size:22px}.page a{font-size:11px}.cover-face small{font-size:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.ghost{display:none}}
</style></head><body><main id="shelf" aria-label="Projetos do Dabliu em uma estante contínua"><div class="rack" id="rack"></div></main><div class="vignette"></div><section id="viewer" hidden role="dialog" aria-modal="true" aria-label="Livro do projeto"><button class="dismiss" aria-label="Fechar livro">×</button><div class="volume" id="volume"><div class="back"></div><div class="book-edge"></div><div class="page"><span class="glyph"></span><h2 id="pageTitle"></h2><p id="pageDesc"></p><a id="projectLink" target="_blank" rel="noopener noreferrer">Entrar no projeto</a></div><div class="lid"><div class="cover-face"><small>DABLIU · COLEÇÃO DIGITAL</small><span class="emblem"></span><strong></strong><small class="category"></small></div><div class="lining">✳</div></div></div></section><script>
const projects=[
['TORRE DE DANOI','Jogo · Puzzle','O clássico jogo de lógica. 100 níveis, recordes e progresso local.','https://hanoi-23d2.onrender.com','♜'],['BINGO','Jogo','Bingo digital para jogar direto no navegador.','https://jogo-bingo.onrender.com','✺'],['PONTINHOS','Jogo · Estratégia','Um jogo simples de estratégia e precisão.','https://jogo-dos-pontinhos.onrender.com','⁙'],['TERNO','Jogo','Uma experiência de jogo publicada no GitHub Pages.','https://d3ividdiniz.github.io/terno_jogo_js/','♠'],['DARK HISTORIE','Jogo · História','Uma experiência narrativa com estética sombria.','https://dark-historie-game.onrender.com','☾'],['ROLETA RUSSA DO CAFÉ','Jogo','Uma roleta para decidir o destino do próximo café.','https://roleta-russa-do-cafe.onrender.com','☕'],['RANKING DOG','Jogo · Social','Monte e compare seu ranking de cachorros.','https://ranking-dog.onrender.com','♞'],['PERIODIC TABLE','Laboratório · Ferramenta','Uma tabela periódica interativa.','https://p-e-r-i-and-t-a-b-l-e.onrender.com','⚗'],['PAINT JS','Laboratório','Experimento de desenho feito para a web.','https://d3ividdiniz.github.io/paint_js/','✎'],['HUB TOOLS','Ferramentas','Coleção de ferramentas úteis em um só lugar.','https://hub-tools-ebon.vercel.app','✣'],['FOCO','App · Estudos','Controle de tempo e estudos.','https://foco-4yd7.onrender.com','◷'],['DABLIU.FIT','App · Fitness','Seu espaço digital para academia e treino.','https://dabliu.fit/','✦'],['PELELECA','App','Um espaço digital para acompanhar e organizar momentos do dia a dia.','https://peleleca.onrender.com/','❋'],['LAÇOS DE AÇÚCAR','App','Uma experiência delicada para celebrar momentos especiais.','https://lacos-acucar.onrender.com/','❧'],['DABLIU NOTES','App · Notas','Um espaço tranquilo para guardar o que importa.','https://dabliunotes.space/','✎'],['FUNCTION GAME','Jogo · Puzzle','Um jogo de desafios baseados em funções e lógica.','https://functiongame.onrender.com/','ƒ'],['DAY BY DAY','App · Organização','Acompanhe sua rotina e seus objetivos dia após dia.','https://day-by-day-srru.onrender.com/','☼'],['CRONOMETRE','Ferramenta · Tempo','Um cronômetro simples para medir o tempo das atividades.','https://c-r-o-n-o-m-e-t-r-e.onrender.com/','◴'],['PARRY','Jogo · Social','Jogos para reunir todo mundo e jogar junto.','https://dabliugames.space/','♛'],['DABLIU CHESS','Jogo · Xadrez','Analise partidas e jogue xadrez contra o Stockfish.','https://dabliuchess.space/','♞']];

// The URL is the seed; all styling choices come from curated options.
const palettes=[['#4c2b28','#e8cba0'],['#2f4237','#ddd3a8'],['#343e51','#dfd8b9'],['#89653e','#f4dfb6'],['#633742','#edcda9'],['#a08f66','#283327'],['#32382f','#c9bc88'],['#604b35','#e7cba0'],['#2b484b','#d3d5b1'],['#783d2e','#efcd9d']];
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function design(p){const n=hash(p[3]),[cover,ink]=palettes[n%palettes.length];return{material:['leather','cloth','paper'][(n>>>4)%3],style:`--cover:${cover};--ink:${ink};--width:${91+(n>>>8)%8}%;--offset:${(n>>>16)%3}%;--h:${74+(n>>>13)%34}px;--frame:${(n>>>22)%3===0?'1px solid currentColor':(n>>>22)%3===1?'3px double currentColor':'0'};--bands:${(n>>>7)%2?'1px solid currentColor':'0'};--font:${(n>>>9)%3===0?'Georgia':(n>>>9)%3===1?'DM Serif Display':'Space Mono'},serif;--spacing:${(n>>>6)%2?'.02em':'.07em'}`}}
const shelf=document.querySelector('#shelf'),rack=document.querySelector('#rack'),viewer=document.querySelector('#viewer'),volume=document.querySelector('#volume'),closeButton=document.querySelector('.dismiss'),link=document.querySelector('#projectLink');
let selected=null,busy=false,timers=[],ghost=null,cycle=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function spine(p){const b=document.createElement('button'),d=design(p);b.className='slot';b.style.cssText=d.style;b.setAttribute('aria-label','Abrir '+p[0]);b.setAttribute('aria-haspopup','dialog');const face=document.createElement('span');face.className='spine '+d.material;for(const [cls,text] of [['seal',p[4]],['spine-title',p[0]],['tail',['✦','❧','✳','⁂','◈'][hash(p[3])%5]]]){const el=document.createElement('span');el.className=cls;el.textContent=text;face.append(el)}const band=document.createElement('span');band.className='bands';face.append(band);b.append(face);b.onclick=()=>open(p,b);return b}
for(let i=0;i<3;i++){const group=document.createElement('div');group.className='group';projects.forEach(p=>group.append(spine(p)));rack.append(group)}
// Reuse three identical groups. Crossing a boundary changes only the scroll
// offset: no rows are appended and the DOM stays bounded at 60 books.
function measure(){const old=cycle;cycle=rack.firstElementChild.offsetHeight;shelf.scrollTop=old?cycle+(shelf.scrollTop%old):cycle}requestAnimationFrame(measure);document.fonts.ready.then(measure);window.addEventListener('resize',measure);
shelf.addEventListener('scroll',()=>{if(selected||!cycle)return;const y=shelf.scrollTop;if(y<cycle*.5)shelf.scrollTop=y+cycle;else if(y>cycle*1.5)shelf.scrollTop=y-cycle},{passive:true});
function later(fn,ms){timers.push(setTimeout(fn,reduced.matches?0:ms))}
function open(p,b){if(busy||selected)return;busy=true;selected=b;const d=design(p),face=b.querySelector('.spine'),rect=face.getBoundingClientRect();volume.style.cssText=d.style;const cover=volume.querySelector('.cover-face');cover.className='cover-face '+d.material;cover.querySelector('strong').textContent=p[0];cover.querySelector('.emblem').textContent=p[4];cover.querySelector('.category').textContent=p[1];volume.querySelector('.glyph').textContent=p[4];document.querySelector('#pageTitle').textContent=p[0];document.querySelector('#pageDesc').textContent=p[2];link.href=p[3];link.tabIndex=-1;viewer.setAttribute('aria-label',p[0]);viewer.hidden=false;shelf.inert=true;b.dataset.picked='';
// A detached visual can move without changing the slot's hit area.
ghost=b.cloneNode(true);ghost.removeAttribute('aria-label');ghost.setAttribute('aria-hidden','true');ghost.tabIndex=-1;ghost.className='slot ghost';ghost.style.cssText=d.style+`;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;delete ghost.dataset.picked;document.body.append(ghost);if(!reduced.matches)ghost.animate([{transform:'translate(0,0)',opacity:1},{transform:'translate(30px,-5px) scale(1.07)',opacity:1,offset:.55},{transform:`translate(${innerWidth/2-rect.left-rect.width/2}px,${innerHeight/2-rect.top-rect.height/2}px) scale(.8)`,opacity:0}],{duration:650,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});
requestAnimationFrame(()=>{viewer.classList.add('visible');closeButton.focus()});later(()=>{ghost?.remove();ghost=null;viewer.classList.add('facing')},450);later(()=>{viewer.classList.add('opened');link.tabIndex=0;busy=false},1550)}
function close(){if(!selected)return;timers.forEach(clearTimeout);timers=[];ghost?.remove();ghost=null;busy=true;viewer.classList.remove('opened');link.tabIndex=-1;later(()=>{viewer.classList.remove('facing','visible')},450);later(()=>{viewer.hidden=true;delete selected.dataset.picked;shelf.inert=false;selected.focus({preventScroll:true});selected=null;busy=false},800)}
closeButton.onclick=close;viewer.onclick=e=>{if(e.target===viewer)close()};document.addEventListener('keydown',e=>{if(!selected)return;if(e.key==='Escape')close();if(e.key==='Tab'){const items=viewer.classList.contains('opened')?[closeButton,link]:[closeButton];const i=items.indexOf(document.activeElement);e.preventDefault();items[(i+(e.shiftKey?-1:1)+items.length)%items.length].focus()}});
</script></body></html>
